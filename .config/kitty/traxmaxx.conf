
## name: Tokyo Night
## license: MIT
## author: Folke Lemaitre
## upstream: https://github.com/folke/tokyonight.nvim/raw/main/extras/kitty/tokyonight_night.conf


background #1a1b26
foreground #c0caf5
selection_background #283457
selection_foreground #c0caf5
url_color #73daca
cursor #f7768e
cursor_text_color #1a1b26

# Tabs
active_tab_background #7aa2f7
active_tab_foreground #16161e
inactive_tab_background #292e42
inactive_tab_foreground #545c7e
#tab_bar_background #15161e

# Windows
active_border_color #7aa2f7
inactive_border_color #292e42

# normal
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6

# bright
color8  #414868
color9  #ff899d
color10 #9fe044
color11 #faba4a
color12 #8db0ff
color13 #c7a9ff
color14 #a4daff
color15 #c0caf5

# extended colors
color16 #ff9e64
color17 #db4b4b

# Fonts
font_family      family='Zenbones Mono' postscript_name=Zenbones-Mono
bold_font        family='Zenbones Mono' postscript_name=Zenbones-Mono-Semibold
italic_font      family='Zenbones Mono' postscript_name=Zenbones-Mono-Italic
bold_italic_font family='Zenbones Mono' postscript_name=Zenbones-Mono-Semibold-Italic
font_size 13.5
disable_ligatures never
modify_font cell_height 120%
modify_font cell_width 95%
modify_font underline_position 4
modify_font underline_thickness 150%

# Cursor
custom_shaders cursor-trail-blaze
cursor_trail 1

# URLs
url_style double

# Layout
enabled_layouts splits:split_axis=horizontal

# Tab bar
tab_bar_edge top
tab_bar_margin_width 5.0
tab_bar_margin_height 5.0 0.0
tab_bar_style separator
tab_bar_min_tabs 2
tab_separator ""
tab_title_template "{fmt.fg._5c6370}{fmt.bg.default}{fmt.fg._abb2bf}{fmt.bg._5c6370} ({index}) {tab.active_oldest_exe} {fmt.fg._5c6370}{fmt.bg.default} "
active_tab_title_template "{fmt.fg._BAA0E8}{fmt.bg.default}{fmt.fg.default}{fmt.bg._BAA0E8} ({index}) {tab.active_oldest_exe} {fmt.fg._BAA0E8}{fmt.bg.default} "
inactive_tab_font_style bold

# Remote control
remote_control_password "slkIekh!dhf@sup#"
allow_remote_control yes

# Keymaps
map cmd+f send_text all \x1b[9;F
map cmd+l send_text all \x1b[9;L
map cmd+s send_text all \x1b[9;S
map cmd+r send_text all \x1b[9;R
map cmd+p send_text all \x1b[9;P
map cmd+alt+v send_text all \x1b[9;V

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5

# Splits matching iTerm2 behavior
# iTerm2: Cmd + D → vertical split (side-by-side)
map super+d                launch --location=vsplit --cwd=current

# iTerm2: Cmd + Shift + D → horizontal split (stacked)
map super+shift+d          launch --location=hsplit --cwd=current

# Close current pane (iTerm2: Cmd + W)
map super+w                close_window

# Optional: Close the current tab (iTerm2 often uses Cmd + W for pane, Cmd + Shift + W for tab)
map super+shift+w          close_tab

# Pane navigation (similar feel to iTerm2)
map super+alt+left         focus left
map super+alt+right        focus right
map super+alt+up           focus up
map super+alt+down         focus down

# Cycle focus (optional)
map super+bracketright     focus next
map super+bracketleft      focus previous

# Zoom/maximize current pane (similar to iTerm2's "Maximize Pane" feel)
map super+enter            toggle_layout stack

# Optional: Equalize pane sizes
map super+e                layout_action balance

# Optional: Move pane to a direction (rearrange)
map super+shift+left       move_window left
map super+shift+right      move_window right
map super+shift+up         move_window up
map super+shift+down       move_window down

# vim-kitty-navigator
map ctrl+j kitten pass_keys.py bottom ctrl+j
map ctrl+k kitten pass_keys.py top    ctrl+k
map ctrl+h kitten pass_keys.py left   ctrl+h
map ctrl+l kitten pass_keys.py right  ctrl+l

